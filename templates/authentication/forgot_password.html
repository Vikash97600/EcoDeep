{% extends 'base/base.html' %}

{% block title %}Reset Password – EcoDep{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-5">
        <div class="card card-custom p-4">
            <div class="text-center mb-4">
                <i class="fa-solid fa-key fa-2x text-success mb-2"></i>
                <h4 class="fw-bold">Forgot Password</h4>
                <p class="text-muted small">Enter your registered email address to receive password reset instructions.</p>
            </div>

            <form method="post" action="{% url 'authentication:forgot_password' %}">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-bold small">Registered Email Address</label>
                    {{ form.email }}
                </div>
                <button type="submit" class="btn btn-success w-100 py-2 fw-bold mb-3">Send Reset Instructions</button>
            </form>

            <div class="text-center border-top pt-3">
                <a href="{% url 'authentication:login' %}" class="small text-success fw-bold text-decoration-none">Back to Sign In</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
