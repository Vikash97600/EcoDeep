{% extends 'base/base.html' %}

{% block title %}Bulk Import Libraries – EcoDep{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6">
        <div class="card card-custom p-4">
            <div class="text-center mb-4">
                <i class="fa-solid fa-file-csv fa-3x text-success mb-2"></i>
                <h4 class="fw-bold">Bulk Import Libraries</h4>
                <p class="text-muted small">Upload a CSV file containing package names, categories, languages, and licenses.</p>
            </div>

            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="mb-4">
                    <label class="form-label fw-bold small">Select CSV File</label>
                    {{ form.file }}
                </div>
                <button type="submit" class="btn btn-success w-100 py-2 fw-bold">Upload & Import</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
